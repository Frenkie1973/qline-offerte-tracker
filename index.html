<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Q-Line Offerte Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
--bg:#f5f4f0;--white:#ffffff;--border:#e2e0d8;--border2:#cccac0;
--text:#111110;--muted:#444440;--hint:#888880;
--accent:#ff2300;--accent-bg:#ffece8;--accent-border:#ffb8a8;
--red:#c0392b;--red-bg:#fdf0ee;--red-border:#f0c4be;
--orange:#b8590a;--orange-bg:#fef3e8;--orange-border:#f0d0a8;
--green:#1a5c3a;--green-bg:#eef5f0;--green-border:#b8d4c2;
--blue:#1a3a6c;--blue-bg:#eef2fa;--blue-border:#b8c8e8;
--sans:'Roboto',sans-serif;--mono:'Roboto Condensed',sans-serif;
}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;min-height:100vh}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
.sidebar{background:var(--white);border-right:1px solid var(--border);display:flex;flex-direction:column}
.main{padding:32px 36px;overflow-y:auto}
.logo{padding:20px 20px 16px;border-bottom:1px solid var(--border)}
.logo-name{font-size:15px;font-weight:600;color:var(--text)}
.logo-sub{font-size:11px;color:var(--hint);margin-top:2px;font-family:var(--mono)}
.nav{padding:12px 10px;flex:1}
.nav-btn{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-radius:8px;font-size:14px;color:var(--muted);cursor:pointer;border:none;background:transparent;font-family:var(--sans);width:100%;text-align:left;transition:all .12s}
.nav-btn:hover{color:var(--text);background:var(--bg)}
.nav-btn.active{color:var(--accent);background:var(--accent-bg);font-weight:500}
.nav-badge{font-family:var(--mono);font-size:10px;background:var(--red);color:#fff;padding:1px 6px;border-radius:20px}
.sidebar-foot{padding:16px 20px;border-top:1px solid var(--border)}
.sidebar-hint{font-size:11px;color:var(--hint);line-height:1.7}
.dropzone{border:1.5px dashed var(--border2);border-radius:10px;padding:14px 18px;margin-bottom:24px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:all .15s;background:var(--white)}
.dropzone:hover,.dropzone.over{border-color:var(--accent);background:var(--accent-bg)}
.dz-icon{width:36px;height:36px;border-radius:8px;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-shrink:0;border:1px solid var(--border)}
.dz-title{font-size:13px;font-weight:500;color:var(--text)}
.dz-sub{font-size:11px;color:var(--hint);margin-top:2px;font-family:var(--mono)}
.ph{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:24px}
.ph-title{font-size:22px;font-weight:700;color:var(--text);letter-spacing:-.03em;font-family:var(--mono)}
.ph-title em{color:var(--accent);font-style:normal}
.ph-sub{font-size:12px;color:var(--hint);margin-top:3px}
.btn{font-family:var(--sans);font-size:13px;padding:8px 16px;border-radius:8px;cursor:pointer;border:1px solid var(--border2);font-weight:500;transition:all .12s;background:var(--white);color:var(--text)}
.btn:hover{background:var(--bg)}
.btn-p{background:var(--accent);color:#fff;border-color:var(--accent);font-family:var(--mono);font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.btn-p:hover{background:#c71c00}
.btn-d{background:transparent;border-color:var(--red-border);color:var(--red)}
.btn-d:hover{background:var(--red-bg)}
.alert{background:var(--red-bg);border:1px solid var(--red-border);border-radius:8px;padding:12px 16px;margin-bottom:20px;font-size:13px;display:flex;align-items:center;gap:10px;color:var(--red)}
.alert-dot{width:7px;height:7px;border-radius:50%;background:var(--red);flex-shrink:0;animation:pulse 1.5s infinite}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
.kpi{background:var(--white);border:1px solid var(--border);border-radius:10px;padding:16px 18px}
.kpi-l{font-size:11px;font-family:var(--mono);color:var(--hint);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.kpi-n{font-size:28px;font-weight:600;color:var(--text);letter-spacing:-.03em;font-family:var(--mono)}
.kpi-n.red{color:var(--red)}.kpi-n.green{color:var(--green)}.kpi-n.acc{color:var(--accent)}
.kpi-s{font-size:12px;color:var(--hint);margin-top:3px}
.sh{display:flex;align-items:center;gap:10px;margin-bottom:10px;margin-top:24px}
.sl{font-size:11px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.07em;color:var(--hint)}
.sline{flex:1;height:1px;background:var(--border)}
.sn{font-size:10px;font-family:var(--mono);color:var(--hint)}
table.t{width:100%;border-collapse:collapse;background:var(--white);border-radius:10px;border:1px solid var(--border);overflow:hidden}
table.t th{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--hint);text-align:left;padding:10px 14px;border-bottom:1px solid var(--border);font-weight:400;background:var(--bg)}
tr.row{border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s}
tr.row:last-child{border-bottom:none}
tr.row:hover{background:#fafaf7}
tr.row.urg{border-left:3px solid var(--red)}
tr.row.soon{border-left:3px solid var(--orange)}
tr.row.ok{border-left:3px solid transparent}
tr.row td{padding:12px 14px;vertical-align:middle}
.cn{font-weight:600;font-size:14px;color:var(--text)}
.cs{font-size:12px;color:var(--muted);margin-top:2px;max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cm{font-family:var(--mono);font-size:13px;color:var(--text);font-weight:500}
.ch{font-family:var(--mono);font-size:12px;color:var(--muted)}
.pill{display:inline-flex;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:500;font-family:var(--mono);white-space:nowrap;border:1px solid}
.pn{background:var(--blue-bg);color:var(--blue);border-color:var(--blue-border)}.pc{background:#f0eafa;color:#6b3fa0;border-color:#d4b8f0}.pd{background:#e8f4fd;color:#1a6090;border-color:#a8d4f0}
.po{background:var(--accent-bg);color:var(--accent);border-color:var(--accent-border)}
.pf1{background:var(--orange-bg);color:var(--orange);border-color:var(--orange-border)}
.pf2{background:var(--red-bg);color:var(--red);border-color:var(--red-border)}
.pw{background:var(--green-bg);color:var(--green);border-color:var(--green-border)}
.pl{background:var(--bg);color:var(--hint);border-color:var(--border)}
.pde{background:#f0f0ee;color:#666660;border-color:#d0d0c8;text-decoration:line-through}
.ul{font-size:12px;color:var(--red);font-family:var(--mono);font-weight:500}
.us{font-size:12px;color:var(--orange);font-family:var(--mono);font-weight:500}
.uo{font-size:12px;color:var(--muted);font-family:var(--mono)}
.qbs{display:flex;gap:5px;flex-wrap:wrap}
.qb{font-family:var(--mono);font-size:11px;padding:4px 9px;border-radius:5px;cursor:pointer;border:1px solid var(--border2);background:var(--white);color:var(--muted);transition:all .1s;white-space:nowrap}
.qb:hover{background:var(--bg);color:var(--text)}
.qb.w{border-color:var(--green-border);color:var(--green)}.qb.w:hover{background:var(--green-bg)}
.qb.l{border-color:var(--red-border);color:var(--red)}.qb.l:hover{background:var(--red-bg)}
.pipe{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.pcol{background:var(--white);border:1px solid var(--border);border-radius:10px;padding:12px}
.pch{font-size:10px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--hint);margin-bottom:10px;display:flex;justify-content:space-between}
.pcard{background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:10px;margin-bottom:7px;cursor:pointer;transition:border-color .1s}
.pcard:hover{border-color:var(--border2)}
.pcn{font-size:12px;font-weight:500;color:var(--text);margin-bottom:2px}
.pca{font-family:var(--mono);font-size:11px;color:var(--accent)}
.pcd{font-size:10px;color:var(--hint);margin-top:3px}
.mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:200;align-items:center;justify-content:center}
.mo.open{display:flex}
.mbox{background:var(--white);border-radius:14px;padding:28px;width:480px;max-width:96vw;max-height:92vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.12);animation:fadein .15s ease}
.mhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.mtitle{font-size:16px;font-weight:700;color:var(--text);letter-spacing:-.02em;font-family:var(--mono)}
.mclose{background:none;border:none;color:var(--hint);cursor:pointer;font-size:20px;line-height:1;padding:2px 6px;border-radius:5px}
.mclose:hover{background:var(--bg)}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.ff{margin-bottom:12px}
.ff label{display:block;font-size:11px;font-family:var(--mono);color:var(--hint);margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em}
.ff input,.ff select,.ff textarea{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:8px 11px;font-size:14px;color:var(--text);font-family:var(--sans);outline:none;transition:border-color .15s}
.ff input:focus,.ff select:focus,.ff textarea:focus{border-color:var(--accent);background:var(--white)}
.mfoot{display:flex;gap:8px;margin-top:20px;padding-top:16px;border-top:1px solid var(--border);align-items:center}
.clog-entry{background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:10px 12px;margin-bottom:8px;font-size:12px}
.clog-head{display:flex;justify-content:space-between;margin-bottom:4px}
.clog-badge{font-family:var(--mono);font-size:10px;color:var(--accent);font-weight:500}
.clog-time{font-family:var(--mono);font-size:10px;color:var(--hint)}
.clog-text{color:var(--muted);line-height:1.5}
.clog-add{display:flex;gap:8px;margin-top:8px}
.clog-add textarea{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:7px 10px;font-size:12px;color:var(--text);font-family:var(--sans);outline:none;resize:none;transition:border-color .15s}
.clog-add textarea:focus{border-color:var(--accent);background:var(--white)}
.gc{background:var(--white);border:1px solid var(--border);border-radius:10px;padding:22px;margin-bottom:14px}
.gt{font-size:14px;font-weight:600;color:var(--text);margin-bottom:16px}
.gs{display:flex;gap:14px;margin-bottom:14px}
.gn{width:24px;height:24px;border-radius:50%;background:var(--accent-bg);color:var(--accent);font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;border:1px solid var(--accent-border);margin-top:1px}
.gt2{font-size:13px;font-weight:500;margin-bottom:3px}
.gd{font-size:12px;color:var(--muted);line-height:1.65}
.code{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:10px 12px;font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:8px;line-height:1.9}
.code .h{color:var(--accent)}
.empty{text-align:center;padding:40px;color:var(--hint);font-size:13px}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
<div class="logo">
<div style="display:flex;align-items:center;gap:8px">
<div style="width:9px;height:24px;background:var(--accent);border-radius:2px;flex-shrink:0"></div>
<div class="logo-name" style="font-family:var(--mono);font-weight:700;font-size:19px;letter-spacing:-.01em;text-transform:uppercase">Q-Line <span style="color:var(--accent)">Tracker</span></div>
</div>
<div class="logo-sub" style="margin-top:5px;text-transform:uppercase;letter-spacing:.08em">Offerte follow-up</div>
</div>
<nav class="nav">
<button class="nav-btn active" onclick="show('dash')">Dashboard <span class="nav-badge" id="badge" style="display:none">0</span></button>
<button class="nav-btn" onclick="show('pipe')">Pipeline</button>
<button class="nav-btn" onclick="show('alle')">Alle leads</button>
<button class="nav-btn" onclick="show('analyse')">Analyse</button>
</nav>
<div class="sidebar-foot">
<div class="sidebar-hint">Rood = bel vandaag.<br>Oranje = deze week.<br>Elke ochtend checken.</div>
<div style="margin-top:12px;display:flex;flex-direction:column;gap:6px">
<div id="sync-indicator" style="font-size:11px;color:var(--hint);margin-bottom:8px;font-family:var(--mono)">☁ verbinden...</div>
<button class="btn btn-p" style="font-size:13px;padding:9px 12px;width:100%;text-align:center" onclick="autoSave()">💾 Opslaan</button>
<button class="btn" style="font-size:12px;padding:7px 12px;width:100%;text-align:left" onclick="kiesMap()">📁 Kies opslagmap</button>
<label class="btn" style="font-size:12px;padding:7px 12px;width:100%;text-align:left;cursor:pointer;display:block">↩ Terugzetten<input type="file" accept=".json" style="display:none" onchange="importBackup(this)"></label>
<div id="savepath" style="font-size:10px;color:var(--hint);margin-top:6px;font-family:var(--mono);word-break:break-all"></div>
</div>
</div>
</aside>
<main class="main" id="main"></main>
</div>
<div class="mo" id="mo">
<div class="mbox">
<div class="mhead">
<div style="display:flex;align-items:center;gap:10px;min-width:0">
<div class="mtitle" id="mtitle">Lead toevoegen</div>
<a id="mheadCall" href="#" style="display:none;flex-shrink:0;background:var(--accent);color:#fff;font-size:12px;font-weight:700;padding:4px 12px;border-radius:6px;text-decoration:none">📞 Bel</a>
</div>
<button class="mclose" onclick="closeMo()">×</button>
</div>
<div id="mAdvies" style="display:none;padding:8px 12px;border-radius:8px;margin-bottom:14px;font-size:12.5px;line-height:1.4"></div>
<div class="fg">
<div class="ff"><label>Naam / bedrijf</label><input id="fk" placeholder="Klantnaam"></div>
<div class="ff"><label>Bedrag excl. BTW (€)</label><input id="fb" type="number" placeholder="0"></div>
</div>
<div class="ff"><label>Product / aanvraag</label><input id="fs" placeholder="Waar gaat het over?"></div>
<div class="fg">
<div class="ff"><label>Offertenr.</label><input id="fon" placeholder="bijv. 10260077-3"></div>
<div class="ff"><label>Aanvraagnr. webshop</label><input id="fan" placeholder="bijv. 23802"></div>
</div>
<div class="fg">
<div class="ff"><label>Datum</label><input id="fd" type="date"></div>
<div class="ff"><label>Status</label>
<select id="fst" onchange="toggleDatumOfferte()">
<option value="nieuw">Nieuwe lead</option>
<option value="contact">Contact gelegd</option>
<option value="offerte">Offerte verstuurd</option>
<option value="dealer">Doorgestuurd naar dealer</option>
<option value="gewonnen">Gewonnen</option>
<option value="verloren">Verloren</option>
<option value="deadend">Dead end</option>
</select>
</div>
</div>
<div class="ff" id="fdo-wrap" style="display:none"><label>Datum offerte verstuurd</label><input id="fdo" type="date"></div>
<div class="fg">
<div class="ff"><label>E-mail</label><input id="fe" type="email" placeholder="klant@bedrijf.nl"></div>
<div class="ff"><label>Telefoon</label><input id="ftel" type="tel" placeholder="+31 6..."></div>
</div>
<div class="fg">
<div class="ff"><label>Voorkeur contact</label><select id="fcw"><option value="">— onbekend —</option><option value="Telefonisch">📞 Telefonisch</option><option value="E-mail">✉ E-mail</option><option value="WhatsApp">💬 WhatsApp</option><option value="Anders">Anders</option></select></div>
<div class="ff"><label>Land</label><input id="fland" placeholder="bijv. Nederland"></div>
</div>
<div class="ff"><label>Notitie</label><textarea id="fn" rows="5" placeholder="Kooptermijn, situatie, opmerkingen..."></textarea></div>
<div id="cwrap" style="display:none">
<div style="font-size:11px;font-family:var(--mono);color:var(--hint);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px">Contactlog</div>
<div id="clist"></div>
<div class="clog-add">
<textarea id="fnc" rows="3" placeholder="Wat besproken? Wat gezegd?"></textarea>
<div style="display:flex;flex-direction:column;gap:6px;align-self:flex-end">
<button class="btn btn-p" style="white-space:nowrap" onclick="openContactFromModal()">📞 Gebeld / 💬 Geappt / ✉ Gemaild</button>
</div>
</div>
<div style="margin-top:18px;padding-top:16px;border-top:1px solid var(--border)">
<div style="font-size:11px;font-family:var(--mono);color:var(--hint);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px">🤖 AI-opvolgvoorstel</div>
<div id="aiPogingInfo" style="display:none;font-size:12px;margin-bottom:10px;padding:8px 12px;border-radius:6px"></div>
<div class="ff"><label>Laatste mail van de klant (plak hier, optioneel)</label><textarea id="aiLaatsteMail" rows="4" placeholder="Plak hier de tekst van de laatste mail die je van de klant kreeg — helpt de AI om er specifiek op in te haken..."></textarea></div>
<button class="btn btn-p" style="margin-bottom:10px" onclick="genereerOpvolgVoorstel()" id="aiGenBtn">✨ Genereer opvolgvoorstel</button>
<div id="aiVoorstelWrap" style="display:none">
<textarea id="aiVoorstel" rows="8" style="width:100%;font-family:inherit;font-size:13px;line-height:1.5;padding:10px;border:1px solid var(--border);border-radius:8px;box-sizing:border-box"></textarea>
<button class="btn" style="margin-top:8px" onclick="kopieerVoorstel()">📋 Kopieer tekst</button>
</div>
</div>
</div>
<div class="mfoot">
<button class="btn" onclick="closeMo()">Annuleren</button>
<button class="btn btn-p" onclick="saveDeal()">Opslaan</button>
<button class="btn btn-d" id="bdel" style="display:none;margin-left:auto" onclick="delDeal()">Verwijder</button>
</div>
</div>
</div>
<div id="fu-mo" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:300;align-items:center;justify-content:center">
<div style="background:#fff;border-radius:14px;padding:28px;width:420px;max-width:95vw;box-shadow:0 20px 60px rgba(0,0,0,.15)">
<div style="font-size:16px;font-weight:600;color:#111;margin-bottom:8px">Wanneer opvolgen?</div>
<div id="fu-intro" style="font-size:13px;color:#444;margin-bottom:18px;line-height:1.6"></div>
<div id="fu-note-wrap" style="margin-bottom:14px;display:none">
<label style="font-size:11px;font-family:monospace;color:#888;text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:5px">Notitie</label>
<textarea id="fu-note" rows="2" style="width:100%;background:#f5f4f0;border:1px solid #e2e0d8;border-radius:7px;padding:8px 10px;font-size:13px;font-family:inherit;outline:none;resize:none" placeholder="Wat besproken?"></textarea>
</div>
<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px" id="fu-btns">
<button onclick="setFuDays(3,this)" style="padding:8px 14px;border-radius:7px;border:1px solid #ccc;background:#f5f4f0;font-size:13px;cursor:pointer;font-family:inherit">3 dagen</button>
<button onclick="setFuDays(7,this)" style="padding:8px 14px;border-radius:7px;border:1px solid #ccc;background:#f5f4f0;font-size:13px;cursor:pointer;font-family:inherit">1 week</button>
<button onclick="setFuDays(14,this)" style="padding:8px 14px;border-radius:7px;border:1px solid #ccc;background:#f5f4f0;font-size:13px;cursor:pointer;font-family:inherit">2 weken</button>
<button onclick="setFuDays(30,this)" style="padding:8px 14px;border-radius:7px;border:1px solid #ccc;background:#f5f4f0;font-size:13px;cursor:pointer;font-family:inherit">1 maand</button>
<button onclick="setFuDays(90,this)" style="padding:8px 14px;border-radius:7px;border:1px solid #ccc;background:#f5f4f0;font-size:13px;cursor:pointer;font-family:inherit">3 maanden</button>
<button onclick="setFuDays(180,this)" style="padding:8px 14px;border-radius:7px;border:1px solid #ccc;background:#f5f4f0;font-size:13px;cursor:pointer;font-family:inherit">6 maanden</button>
</div>
<div style="display:flex;align-items:center;gap:8px;margin-bottom:20px">
<input type="number" id="fu-custom" placeholder="Eigen aantal..." min="1" style="width:140px;background:#f5f4f0;border:1px solid #e2e0d8;border-radius:7px;padding:8px 10px;font-size:13px;outline:none">
<span style="font-size:13px;color:#888">dagen</span>
<button onclick="setFuCustom()" style="padding:8px 14px;border-radius:7px;border:1px solid #ccc;background:#f5f4f0;font-size:13px;cursor:pointer;font-family:inherit">OK</button>
</div>
<div style="display:flex;gap:8px;border-top:1px solid #e2e0d8;padding-top:16px">

const td=()=>new Date().toISOString().slice(0,10);
const da=d=>Math.floor((Date.now()-new Date(d))/86400000);
const fmt=n=>n?'€'+Number(n).toLocaleString('nl-NL'):'—';
const fd=d=>new Date(d).toLocaleDateString('nl-NL',{day:'numeric',month:'short'});
const SL={nieuw:'Nieuwe lead',contact:'Contact gelegd',offerte:'Offerte verstuurd',dealer:'Naar dealer',gewonnen:'Gewonnen',verloren:'Verloren',deadend:'Dead end'};
// DEAD LEAD RULE: 4+ outbound zonder reactie + laatste poging 3+ dagen geleden
function getLeadRule(d){
if(d.status==='gewonnen'||d.status==='verloren'||d.status==='deadend')return null;
var contacts=d.contacts||[];
if(contacts.length===0)return null;
var klant_replies=contacts.filter(function(cc){return cc.type==='reactie';}).length;
var outbound=contacts.filter(function(cc){return cc.type!=='reactie';}).length;
// REOPEN: was dead maar heeft nu gereageerd
if(d._was_dead&&klant_replies>0){
return{rule:'REOPENED',label:'Heropend',color:'#2980b9',bg:'#eef2fa'};
}
// DEAD: 4+ outbound, 0 reacties, laatste contact 3+ dagen geleden
if(outbound>=4&&klant_replies===0){
// Check dagen sinds laatste contact
var laatste=contacts[contacts.length-1];
// We don't have exact date objects, so use nextContact or just count
var dagenOpen=Math.floor((Date.now()-new Date(d.datumOfferte||d.datum))/86400000);
if(dagenOpen>=3){
return{rule:'DEAD',label:'Dead lead',color:'#888',bg:'#f5f4f0'};
}
}
// FOLLOW-UP STRATEGY: geef wachttijd advies
if(klant_replies===0&&outbound>0){
var wacht=[0,2,3,4,3][outbound]||3;
return{rule:'FOLLOWUP',label:'Follow-up',outbound:outbound,wacht:wacht,color:'#b8590a',bg:'#fef3e8'};
}
// ACTIVE: klant heeft gereageerd
if(klant_replies>0){
return{rule:'ACTIVE',label:'Actief',color:'#1a5c3a',bg:'#eef5f0'};
}
return null;
}
// ===== Reden-tagging (win/verlies) — voor patroonherkenning in scoring =====
const REDENEN_WIN=['Prijs/waarde overtuigend','Snelle levertijd','Persoonlijk contact/advies','Vertrouwd merk/kwaliteit','Anders'];
const REDENEN_VERLOREN=['Te duur','Gekozen voor concurrent','Geen budget / uitgesteld','Geen reactie meer','Verkeerd product/paste niet','Anders'];
function getRedenStats(){
const won=deals.filter(d=>d.status==='gewonnen'&&d.reden);
const lost=deals.filter(d=>d.status==='verloren'&&d.reden);
const count=arr=>{const m={};arr.forEach(d=>{m[d.reden]=(m[d.reden]||0)+1;});return Object.entries(m).sort((a,b)=>b[1]-a[1]);};
return{won:count(won),lost:count(lost),totWon:won.length,totLost:lost.length};
}
// Leer van gewonnen deals - bereken persoonlijk gemiddelde
function getLeerData(){
var won=deals.filter(function(d){return d.status==='gewonnen';});
var lost=deals.filter(function(d){return d.status==='verloren';});
var deadends=deals.filter(function(d){return d.status==='deadend';});
if(won.length===0)return null;
var totaalInteracties=0, totaalReacties=0, totaalDagen=0, n=0;
won.forEach(function(d){
var contacts=d.contacts||[];
var reacties=contacts.filter(function(cc){return cc.type==='reactie';}).length;
var outbound=contacts.filter(function(cc){return cc.type!=='reactie';}).length;
var dagen=Math.floor((Date.now()-new Date(d.datumOfferte||d.datum))/86400000);
var pairs=0, streak=0;
contacts.forEach(function(cc){
if(cc.type==='reactie'){if(streak>0)pairs++;streak=0;}
else streak++;
});
totaalInteracties+=pairs;
totaalReacties+=reacties;
totaalDagen+=dagen;
n++;
});
return{
gemInteracties:totaalInteracties/n,
gemReacties:totaalReacties/n,
gemDagen:totaalDagen/n,
aantalWon:n,
gemBedragWon:won.reduce(function(s,d){return s+(Number(d.bedrag)||0);},0)/(won.length||1),
gemBedragLost:lost.length?lost.reduce(function(s,d){return s+(Number(d.bedrag)||0);},0)/lost.length:null,
prijsIsTopReden:(function(){
var rs=getRedenStats();
return rs.totLost>=2&&rs.lost[0]&&rs.lost[0][0]==='Te duur'&&(rs.lost[0][1]/rs.totLost)>=0.4;
})()
};
}
// Compute score from contact log + historical learning
function getScore(d){
var contacts=d.contacts||[];
if(d.status==='nieuw')return 0;
if(d.status==='contact')return Math.min(30,((d.contacts||[]).filter(function(cc){return cc.type==='reactie';}).length)*10+5);
if(d.status==='gewonnen')return 100;
if(d.status==='verloren')return 0;
if(d.status==='deadend')return 0;
var interaction_pairs=0;
var klant_replies=0;
var outbound_streak=0;
var laatste_was_reactie=false;
for(var i=0;i<contacts.length;i++){
var cc=contacts[i];
if(cc.type==='reactie'){
klant_replies++;
if(outbound_streak>0)interaction_pairs++;
outbound_streak=0;
laatste_was_reactie=true;
} else {
outbound_streak++;
laatste_was_reactie=false;
}
}
var dagen=Math.floor((Date.now()-new Date(d.datumOfferte||d.datum))/86400000);
var leer=getLeerData();
var score;
if(leer&&leer.aantalWon>=2){
// Score op basis van hoe ver je bent t.o.v. jouw gemiddelde winnende deal
var interactie_pct=leer.gemInteracties>0?Math.min(1,interaction_pairs/leer.gemInteracties):0;
var reactie_pct=leer.gemReacties>0?Math.min(1,klant_replies/leer.gemReacties):0;
var tijd_pct=leer.gemDagen>0?Math.min(1,dagen/leer.gemDagen):0;
// Gewogen: interacties 40%, reacties 40%, tijd 20%
score=(interactie_pct*40)+(reactie_pct*40)+(tijd_pct*20);
// Bonus/malus
if(laatste_was_reactie)score+=10;
if(outbound_streak>=3)score-=10;
// Patroonherkenning uit getagde verliesredenen: als "Te duur" de dominante verliesreden is
// en dit bedrag ruim boven het gemiddelde gewonnen bedrag ligt, extra voorzichtig scoren.
if(leer.prijsIsTopReden&&d.bedrag&&leer.gemBedragWon&&Number(d.bedrag)>leer.gemBedragWon*1.3){
score-=8;
}
score=Math.min(95,Math.max(5,Math.round(score)));
} else {
// Nog niet genoeg data - gebruik basisformule
score=(interaction_pairs*25)+(klant_replies*15)-(outbound_streak*5)-(Math.max(0,dagen-30)*0.5)+(laatste_was_reactie?15:0);
score=Math.min(95,Math.max(5,Math.round(score)));
}
return score;
}
// Voorspel wanneer lead slachtrijp is
function getVoorspelling(d){
var leer=getLeerData();
if(!leer||leer.aantalWon<2)return null;
var contacts=d.contacts||[];
var klant_replies=contacts.filter(function(cc){return cc.type==='reactie';}).length;
var interaction_pairs=0, streak=0;
contacts.forEach(function(cc){
if(cc.type==='reactie'){if(streak>0)interaction_pairs++;streak=0;}
else streak++;
});
var dagen=Math.floor((Date.now()-new Date(d.datumOfferte||d.datum))/86400000);
var nog_interacties=Math.max(0,Math.ceil(leer.gemInteracties-interaction_pairs));
var nog_reacties=Math.max(0,Math.ceil(leer.gemReacties-klant_replies));
var nog_dagen=Math.max(0,Math.ceil(leer.gemDagen-dagen));
return{
nog_interacties:nog_interacties,
nog_reacties:nog_reacties,
nog_dagen:nog_dagen,
gem_interacties:Math.round(leer.gemInteracties*10)/10,
gem_reacties:Math.round(leer.gemReacties*10)/10,
gem_dagen:Math.round(leer.gemDagen),
aantalWon:leer.aantalWon
};
}
// Compute display status from contact log
function getDisplayStatus(d){
if(d.status==='nieuw')return{key:'nieuw',label:'Nieuwe lead',pill:'pn'};
if(d.status==='contact'){
var contacts=d.contacts||[];
var reacties=contacts.filter(function(cc){return cc.type==='reactie';}).length;
if(reacties>0)return{key:'contact',label:'Reageert',pill:'pc'};
return{key:'contact',label:'Contact gelegd',pill:'pc'};
}
if(d.status==='dealer')return{key:'dealer',label:'Naar dealer',pill:'pd'};
if(d.status==='gewonnen')return{key:'gewonnen',label:'Gewonnen',pill:'pw'};
if(d.status==='verloren')return{key:'verloren',label:'Verloren',pill:'pl'};
if(d.status==='deadend')return{key:'deadend',label:'Dead end',pill:'pde'};
// offerte verstuurd - compute FU level from contacts
var contacts=d.contacts||[];
var outbound=contacts.filter(function(cc){return cc.type==='bel'||cc.type==='mail';}).length;
var reacties=contacts.filter(function(cc){return cc.type==='reactie';}).length;
if(outbound===0)return{key:'offerte',label:'Offerte verstuurd',pill:'po'};
if(reacties===0&&outbound===1)return{key:'fu1',label:'Follow-up 1',pill:'pf1'};
if(reacties===0&&outbound>=2)return{key:'fu2',label:'Follow-up 2+',pill:'pf2'};
if(reacties>0&&outbound>reacties)return{key:'fu1',label:'In gesprek',pill:'pf1'};
if(reacties>0)return{key:'offerte',label:'Actief gesprek',pill:'po'};
return{key:'offerte',label:'Offerte verstuurd',pill:'po'};
}
const SP={nieuw:'pn',offerte:'po',fu1:'pf1',fu2:'pf2',gewonnen:'pw',verloren:'pl'}; // legacy
function urg(d){
if(['gewonnen','verloren','deadend'].includes(d.status))return'none';
if(d.status==='nieuw'||d.status==='contact'||d.status==='dealer')return'ok';
// Recente klantreactie = altijd urgent
const maanden={'jan':0,'feb':1,'mrt':2,'apr':3,'mei':4,'jun':5,'jul':6,'aug':7,'sep':8,'okt':9,'nov':10,'dec':11};
function pd2(s){if(!s)return new Date(0);if(s.match(/^\d{4}-\d{2}-\d{2}$/))return new Date(s);const m=s.match(/^(\d+)\s+(\w+)/);if(m){const mn=maanden[m[2].toLowerCase()];return new Date(new Date().getFullYear(),(mn!==undefined?mn:0),parseInt(m[1]));}return new Date(s);}
const contacts=d.contacts||[];
const laatste=contacts.length?contacts[contacts.length-1]:null;
const gisteren=new Date(Date.now()-86400000*2);
if(laatste&&laatste.type==='reactie'&&pd2(laatste.datum)>gisteren)return'urg';
if(d.nextContact){
const days=Math.floor((new Date(d.nextContact)-Date.now())/86400000);
if(days<0)return'urg';
if(days<=2)return'soon';
return'ok';
}
return'ok';
}
// Migrate old fu1/fu2 statuses to offerte
deals.forEach(function(d){if(d.status==='fu1'||d.status==='fu2')d.status='offerte';});
const MAANDEN={'jan':0,'feb':1,'mrt':2,'apr':3,'mei':4,'jun':5,'jul':6,'aug':7,'sep':8,'okt':9,'nov':10,'dec':11};
function pdContact(s){if(!s)return new Date(0);if(s.match(/^\d{4}-\d{2}-\d{2}$/))return new Date(s);const m=s.match(/^(\d+)\s+(\w+)/);if(m){const mn=MAANDEN[m[2].toLowerCase()];return new Date(new Date().getFullYear(),(mn!==undefined?mn:0),parseInt(m[1]));}return new Date(s);}
function ns(d){
if(d.status==='nieuw')return'Offerte nog niet verstuurd';
// Check of klant recent heeft gereageerd
const contacts=d.contacts||[];
const laatste=contacts.length?contacts[contacts.length-1]:null;
const gisteren=new Date(Date.now()-86400000*2);
if(laatste&&laatste.type==='reactie'&&pdContact(laatste.datum)>gisteren){
return'📩 Klant reageerde — direct contact opnemen!';
}
if(d.nextContact){
const days=Math.ceil((new Date(d.nextContact)-Date.now())/86400000);
if(days<0)return`${Math.abs(days)}d te laat`;
if(days===0)return'Vandaag opvolgen';
return`Over ${days}d opvolgen`;
}
return'Stel follow-up in';
}
// Advies of doorgaan of stoppen de moeite waard is, gebaseerd op bekende
// sales-researchregels (niet afhankelijk van veel eigen won/lost-data):
// - Snelheid van eerste opvolging (Lead Response Management-onderzoek: binnen
// 5 min reageren geeft tot 4x hogere conversie dan na 30+ min)
// - "Rule of 5-8 touches" (Brevet/Velocify): de meeste deals hebben 5-8
// contactmomenten nodig, maar na 5+ zonder enige reactie daalt de kans sterk
// - Deal-veroudering: leads die 30-60+ dagen stilliggen sluiten zelden nog
// (gangbare B2B CRM-vuistregel, o.a. HubSpot-onderzoek naar lead-decay)
function getAdvies(d){
if(['gewonnen','verloren','deadend'].includes(d.status))return null;
if(d.status==='nieuw'){
return{label:'Nog niet opgevolgd',kleur:'#888',uitleg:'Hoe sneller je reageert, hoe hoger de kans. Onderzoek naar lead-respons laat tot 4x hogere conversie zien bij reageren binnen 5 minuten t.o.v. 30+ minuten.'};
}
const contacts=d.contacts||[];
let outbound_streak=0,laatste_was_reactie=false;
for(let i=0;i<contacts.length;i++){
const cc=contacts[i];
if(cc.type==='reactie'){outbound_streak=0;laatste_was_reactie=true;}
else{outbound_streak++;laatste_was_reactie=false;}
}
const laatsteContact=contacts.length?contacts[contacts.length-1]:null;
const referentieDatum=laatsteContact?pdContact(laatsteContact.datum):new Date(d.datum||0);
const dagenStil=Math.floor((Date.now()-referentieDatum)/86400000);
const score=getScore(d);
if(laatste_was_reactie){
return{label:'Warm — klant reageerde net',kleur:'#1a5c3a',uitleg:'De klant heeft als laatste gereageerd. Pak dit snel op: momentum vasthouden is in vrijwel elk salesonderzoek de belangrijkste factor voor conversie.'};
}
if(outbound_streak>=5){
return{label:'Waarschijnlijk kansloos — overweeg te stoppen',kleur:'#c0392b',uitleg:`${outbound_streak} contactpogingen zonder enige reactie. Vuistregel uit onderzoek naar opvolggedrag: na 5-8 onbeantwoorde pogingen is de resterende kans doorgaans verwaarloosbaar. Dit lijkt zonde van je tijd.`};
}
if(dagenStil>60){
return{label:'Slapend — waarschijnlijk zonde van de tijd',kleur:'#c0392b',uitleg:`${dagenStil} dagen geen enkele beweging. Leads die 60+ dagen stilliggen zonder reactie sluiten in de praktijk zelden nog.`};
}
if(outbound_streak>=3){
return{label:'Laatste pogingen waard',kleur:'#c9820a',uitleg:`De meeste deals hebben 5-8 contactmomenten nodig voor een reactie — je zit op ${outbound_streak}. Probeer nog 1-2x via een ander kanaal (bijv. bellen i.p.v. mailen) voordat je afschrijft.`};
}
if(dagenStil>30){
return{label:'Wordt koud',kleur:'#c9820a',uitleg:`Al ${dagenStil} dagen geen contact. Plan snel een laatste opvolgmoment, anders koelt de kans verder af.`};
}
if(score>=60){
return{label:'Sterke kans — doorpakken',kleur:'#1a5c3a',uitleg:`Score ${score}/100 — dit traject verloopt beter dan gemiddeld voor je gewonnen deals.`};
}
return{label:'Normaal vervolgen',kleur:'#5a6b8c',uitleg:`Score ${score}/100. Geen bijzondere signalen — gewoon volgens plan opvolgen.`};
}
function parseXml(text){
const doc=new DOMParser().parseFromString(text,'text/xml');
const g=t=>doc.querySelector(t)?.textContent?.trim()||'';
// Formaat 1: webshop aanvraag (Naam, E-mailadres, Product, ID)
if(g('Naam')){
const adres=[g('Address'),g('Zipcode'),g('City'),g('Country')].filter(Boolean).join(', ');
const wanneer=g('WannPlanenSieDenKauf')||g('WhenDoYouPlanToBuy')||'';
const type=g('WelcheArtVonBetriebOderSituationTrifftAufSieZu')||g('TypeOfBusiness')||'';
const notitie=[wanneer?`Kooptermijn: ${wanneer}`:'',type?`Type klant: ${type}`:'',adres?`Adres: ${adres}`:''].filter(Boolean).join('\n');
const contactWay=g('PreferredContactWay')||'';
const kooptermijn=g('WannPlanenSieDenKauf')||'';
const land=g('Country')||'';
const extraNotitie=[contactWay?`Voorkeur contact: ${contactWay}`:'',kooptermijn?`Kooptermijn: ${kooptermijn}`:'',land?`Land: ${land}`:''].filter(Boolean).join('\n');
const notitieXml=[notitie,extraNotitie].filter(Boolean).join('\n');
return{klant:g('Naam'),email:g('E-mailadres'),sub:g('Product')||g('Onderwerp'),aanvraagnr:g('ID'),telefoon:g('Phone'),land,contactWay,kooptermijn,datum:td(),status:'nieuw',notitie:notitieXml};
}
// Formaat 2: contactformulier (fromName, fromEmail, message als JSON)
const naam=g('fromName');
const email=g('fromEmail');
const aanvraagnr=g('id');
const datumRaw=g('dateCreated');
const datum=datumRaw?datumRaw.slice(0,10):td();
const subject=g('subject');
let telefoon='',bericht='',notitie='';
try{
const msg=JSON.parse(g('message'));
telefoon=msg.Telefoonnummer||msg.Phone||msg.telefoon||'';
bericht=msg.body||msg.message||msg.bericht||'';
}catch(e){
bericht=g('message');

landen[land]=(landen[land]||0)+1;

async function analyseerContactTekst(contacts){
var tekst=contacts.map(function(c){return(c.nota||'').toLowerCase();}).join(' ');
var bonus=0;var signalen=[];var next_action='';
var pos=[
{w:['wanneer kunnen','wanneer start','wanneer lever'],b:20,s:'+ Klant vraagt naar planning'},
{w:['akkoord','gaan we doen','doen we','mooie prijs','goed voorstel'],b:20,s:'+ Akkoord signaal'},
{w:['bouwvergunning','vergunning','tekening','architect'],b:15,s:'+ Concreet aan de slag'},
{w:['heel geinteresseerd','zeer geinteresseerd','graag','absoluut'],b:15,s:'+ Sterke interesse'},
{w:['teruggebeld','heeft teruggebeld','zelf gebeld','belde terug'],b:15,s:'+ Klant belt zelf terug'},
{w:['deadline','voor de zomer','voor de winter','dit jaar nog'],b:10,s:'+ Urgentie aanwezig'},
{w:['budget','financiering','gespaard'],b:10,s:'+ Budget besproken'},
{w:['partner','man','vrouw','samen beslissen'],b:5,s:'+ Beslissers betrokken'}
];
var neg=[
{w:['te duur','te hoog','concurrent','andere aanbieder','goedkoper'],b:-15,s:'- Prijsweerstand'},
{w:['geen reactie','niet opgenomen','voicemail','niet bereikbaar'],b:-10,s:'- Geen reactie'},
{w:['bedenktijd','nadenken','later','volgend jaar','uitstellen'],b:-15,s:'- Uitsteller'},
{w:['geen interesse','niet relevant','niet nodig','toch niet'],b:-25,s:'- Geen interesse'},
{w:['al gekocht','al besteld','al geregeld','anders gedaan'],b:-30,s:'- Al elders gekocht'}
];
pos.forEach(function(p){p.w.forEach(function(w){if(tekst.includes(w)&&!signalen.find(function(s){return s===p.s;})){bonus+=p.b;signalen.push(p.s);}});});
neg.forEach(function(n){n.w.forEach(function(w){if(tekst.includes(w)&&!signalen.find(function(s){return s===n.s;})){bonus+=n.b;signalen.push(n.s);}});});
if(tekst.includes('wanneer kunnen')||tekst.includes('wanneer start'))next_action='Klant wil planning — stuur concrete startdatum en sluit deal!';
else if(tekst.includes('akkoord')||tekst.includes('gaan we doen'))next_action='Akkoord signaal — stuur opdrachtbevestiging vandaag!';
else if(tekst.includes('te duur')||tekst.includes('concurrent'))next_action='Prijsweerstand — bel en bespreek meerwaarde Q-Line vs concurrent.';
else if(tekst.includes('bedenktijd')||tekst.includes('nadenken'))next_action='Klant twijfelt — vraag direct: wat houdt je nog tegen?';
else if(tekst.includes('partner')||tekst.includes('samen beslissen'))next_action='Beide beslissers betrekken — plan afspraak met koppel/partner.';
else if(tekst.includes('vergunning')||tekst.includes('tekening'))next_action='Klant is concreet bezig — stay close en bied hulp aan bij vergunning.';
else if(tekst.includes('geen reactie')||tekst.includes('voicemail'))next_action='Probeer andere aanpak: WhatsApp of mail ipv bellen.';
else next_action='Follow-up sturen en concreet om beslissing vragen.';
return{bonus:Math.max(-40,Math.min(30,bonus)),signalen:signalen.slice(0,3),next_action:next_action};
}

? contacts.map(c=>`- [${c.type}, ${c.datum} ${c.tijd||''}] ${c.tekst||c.nota||''}`).join('\n')
: '(nog geen contactmomenten gelogd)';
// Tel hoeveel keer Frank al heeft opgevolgd zonder reactie ("outbound streak"),
// zelfde telling als getAdvies() gebruikt, zodat de AI de toon hierop afstemt.
let outboundStreak=0;
for(let i=0;i<contacts.length;i++){
if(contacts[i].type==='reactie')outboundStreak=0;
else outboundStreak++;
}
const advies=getAdvies(d);
const toonInstructie=outboundStreak>=5
? `Dit is al de ${outboundStreak}e keer dat Frank opvolgt zonder enige reactie. Schrijf een kort, eerlijk "laatste kans"-bericht — geen enthousiaste toon meer, gewoon direct vragen of er nog interesse is en dat je het traject anders sluit. Geen verwijten, gewoon zakelijk.`
: outboundStreak>=3
? `Dit is al de ${outboundStreak}e opvolgpoging zonder reactie. Wees iets directer dan bij een eerste bericht, en overweeg een ander kanaal voor te stellen (bijv. "zal ik anders even bellen?") in plaats van gewoon nogmaals te mailen.`
: `Dit is nog een vroege opvolging (poging ${outboundStreak+1}), dus een vriendelijke, lichte toon is prima.`;
const prompt=`Je helpt Frank, eigenaar van Q-Line Equestrian (paardensystemen: horsewalkers, solariums, hekwerk, stalinrichting), een kort opvolgbericht te schrijven aan een klant. Doel: een reactie loskrijgen van een klant die stil is geworden — niet opdringerig, maar direct en praktisch, in Franks eigen stijl: zakelijk maar informeel, geen overbodige poespas.
KLANTGEGEVENS:
- Naam/bedrijf: ${d.klant}
- Interesse/product: ${d.onderwerp||'onbekend'}
- Bedrag offerte: ${d.bedrag?('€'+d.bedrag):'nog niet bekend'}
- Land: ${d.land||'onbekend'}
- Status: ${d.status}
- Notities: ${d.notitie||'geen'}
CONTACTGESCHIEDENIS (chronologisch, wat er al verstuurd/besproken is):
${contactlog}
OPVOLG-CONTEXT: ${toonInstructie}
${advies?`Systeemadvies over deze lead: "${advies.label}" — ${advies.uitleg}`:''}
${laatsteMail?`LAATSTE MAIL DIE DE KLANT STUURDE (haak hier specifiek op in):\n${laatsteMail}\n`:'(Frank heeft geen laatste mail van de klant geplakt — baseer je alleen op de contactgeschiedenis hierboven.)'}
Schrijf een kort opvolgbericht (mail of app-bericht, max ~120 woorden) dat:
- niet herhaalt wat al gezegd is, maar er op voortbouwt
- een concrete, laagdrempelige vraag stelt zodat de klant makkelijk kan reageren (bijv. een simpele ja/nee-vraag of een keuze tussen 2 opties, in plaats van een open "hoe staat het ermee?")
- past bij het land/de taal van de klant (Duitse klant = Duits, in de juiste formaliteit; Nederlandse klant = Nederlands)
- Franks toon aanhoudt: direct, vriendelijk-zakelijk, geen overdreven verkooppraat
- rekening houdt met de OPVOLG-CONTEXT hierboven qua directheid/toon
Geef ALLEEN de tekst van het bericht terug, geen aanhef-uitleg of extra commentaar erbij, geen aanhalingstekens eromheen.`;
btn.disabled=true;btn.textContent='✨ Bezig met genereren...';
const oldLabel=wrap.querySelector('.ai-auto-label');
if(oldLabel)oldLabel.remove();
try{
const response=await fetch("https://qline-ai-proxy.f-timmerhuis.workers.dev",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
model:"claude-sonnet-4-6",
max_tokens:1000,
messages:[{role:"user",content:prompt}]
})
});
const data=await response.json();
const tekst=(data.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('\n').trim();
if(!tekst)throw new Error('Geen tekst ontvangen');
document.getElementById('aiVoorstel').value=tekst;
wrap.style.display='block';
}catch(e){
alert('Genereren mislukt: '+e.message+'. Probeer het nog eens.');
}finally{
btn.disabled=false;btn.textContent='✨ Genereer opvolgvoorstel';
}
}
function kopieerVoorstel(){
const ta=document.getElementById('aiVoorstel');
ta.select();
navigator.clipboard.writeText(ta.value).then(()=>{
const btns=document.querySelectorAll('#aiVoorstelWrap .btn');
if(btns[0]){const orig=btns[0].textContent;btns[0].textContent='✅ Gekopieerd!';setTimeout(()=>{btns[0].textContent=orig;},1500);}
const d=deals.find(x=>x.id===editId);
if(d&&d.aiVoorstel){delete d.aiVoorstel;delete d.aiVoorstelDatum;save();}
});
}

document.getElementById('mo').addEventListener('click',e=>{if(e.target.id==='mo')closeMo()});
loadWithSync();
